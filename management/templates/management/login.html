<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fabro Leather</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'FABRO__BRAND ICON_FINAL_CMYK.png' %}">
    <link href="{% static 'vendor/fontawesome/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/fabro-global.css' %}?v=20260831-language-menu" rel="stylesheet">
    <script>window.FABRO_LANGUAGE = '{{ LANGUAGE_CODE|default:"en"|escapejs }}';</script>
    <script src="{% static 'js/fabro-i18n.js' %}?v=20260831-search-clear" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121214;
            background-image:
                radial-gradient(circle, rgba(220, 38, 38, 0.2) 0 1px, transparent 1.7px),
                linear-gradient(115deg, transparent 0%, rgba(220, 38, 38, 0.055) 42%, rgba(255, 255, 255, 0.035) 50%, transparent 58%),
                linear-gradient(100deg, transparent 0%, rgba(220, 38, 38, 0.13) 38%, transparent 56%),
                linear-gradient(rgba(18, 18, 20, 0.8), rgba(18, 18, 20, 0.9)),
                url("{% static 'seat-background.webp' %}");
            background-position: 0 0, center, center, center, center;
            background-size: 28px 28px, 100% 100%, 100% 100%, 100% 100%, cover;
            background-attachment: fixed, fixed, fixed, fixed, fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.09), transparent 42%),
                rgba(30, 30, 35, 0.76);
            backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            animation: loginPanelIn 0.52s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #dc2626, #f43f5e, #f43f5e);
        }

        .login-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            transform: translateX(-120%);
            background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.12), transparent 48%);
            animation: loginSheen 3.6s ease 0.6s 1 both;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-icon {
            width: min(17rem, 82vw);
            height: 6.5rem;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 16px 34px rgba(220, 38, 38, 0.28));
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #dc2626, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .brand-subtitle {
            color: #cbd5e1;
            font-size: 0.875rem;
            font-weight: 400;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .form-subtitle {
            color: #cbd5e1;
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            z-index: 1;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.5);
            color: #f8fafc;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
            background: rgba(15, 23, 42, 0.7);
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(220, 38, 38, 0.48);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            color: #fca5a5;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.75rem;
        }

        .loading {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .ambient-sweeps {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .sweep {
            position: absolute;
            width: 58vw;
            height: 22vh;
            left: -12vw;
            background: linear-gradient(90deg, transparent, rgba(220, 38, 38, 0.1), transparent);
            transform: rotate(-14deg);
            animation: sweepDrift 9s cubic-bezier(0.16, 1, 0.3, 1) infinite alternate;
        }

        .sweep:nth-child(1) { top: 18%; }
        .sweep:nth-child(2) {
            top: 64%;
            animation-delay: -3s;
            opacity: 0.75;
        }

        @keyframes sweepDrift {
            from { transform: translate3d(-4vw, 0, 0) rotate(-14deg); }
            to { transform: translate3d(54vw, 2vh, 0) rotate(-14deg); }
        }

        @keyframes loginPanelIn {
            from { opacity: 0; transform: translate3d(0, 20px, 0) scale(0.97); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        @keyframes loginSheen {
            to { transform: translateX(120%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-container,
            .login-container::after,
            .sweep {
                animation: none;
            }
        }

        @media (max-width: 480px) {
            body {
                background-position: 0 0, center, center, center, 18% center;
                background-attachment: scroll, scroll, scroll, scroll, scroll;
            }

            .login-container {
                padding: 2rem;
                margin: 1rem;
            }

            .brand-title {
                font-size: 1.75rem;
            }

            .form-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-sweeps" aria-hidden="true">
        <div class="sweep"></div>
        <div class="sweep"></div>
    </div>

    <div class="login-container">
        <div class="brand-section">
            <div class="brand-icon">
                <img src="{% static 'fabro-logo.png' %}" alt="Fabro Leather Logo">
            </div>
            <h1 class="brand-title">Fabro Leather</h1>
            <p class="brand-subtitle">Car Seat Management System</p>
        </div>

        <div class="form-section">
            <h2 class="form-title">Welcome Back</h2>
            <p class="form-subtitle">Please sign in to your account</p>

            <form method="POST" action="{% url 'login' %}" id="loginForm">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" 
                               name="username" 
                               id="username" 
                               class="form-input" 
                               placeholder="Enter your username"
                               required 
                               autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" 
                               name="password" 
                               id="password" 
                               class="form-input" 
                               placeholder="Enter your password"
                               required 
                               autocomplete="current-password"
                               style="padding-right: 2.8rem;">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password" style="position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; padding: 0.25rem; font-size: 0.95rem; z-index: 2;">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginButton">
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="buttonText">Sign In</span>
                    <div class="loading" id="loadingSpinner"></div>
                </button>

                {% if form.errors %}
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}
            </form>
        </div>

        <div class="footer-text">
            © 2025 Fabro Leather. All rights reserved.
        </div>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            } else {
                input.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        }

        // Form submission handling
        document.getElementById('loginForm').addEventListener('submit', function() {
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            button.disabled = true;
            buttonText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            
            // Re-enable button after 5 seconds as fallback
            setTimeout(() => {
                button.disabled = false;
                buttonText.style.display = 'block';
                loadingSpinner.style.display = 'none';
            }, 5000);
        });

        // Auto-focus username field
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });

        // Enter key handling
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').submit();
            }
        });
    </script>
</body>
</html>
