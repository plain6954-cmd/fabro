<span class="status-stage-pill {{ stage.status }}" data-stage-role="{{ stage.role }}" data-stage-status="{{ stage.status }}" title="{{ stage.role }}: {{ stage.label }}{% if stage.reviewer %} · {{ stage.reviewer }}{% endif %}{% if stage.date %} · {{ stage.date|date:'M d, Y H:i' }}{% endif %}" aria-label="{{ stage.role }}: {{ stage.label }}{% if stage.reviewer %} by {{ stage.reviewer }}{% endif %}{% if stage.date %} on {{ stage.date|date:'M d, Y H:i' }}{% endif %}">{{ stage.role }}<span class="sr-only">: {{ stage.label }}</span></span>
