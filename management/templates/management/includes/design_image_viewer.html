{% load i18n %}
<dialog id="designImageViewer" class="design-image-viewer" aria-labelledby="designViewerTitle">
    <div class="design-viewer-toolbar">
        <strong id="designViewerTitle"></strong>
        <button type="button" data-viewer-action="close" aria-label="{% translate 'Close image viewer' %}">✕</button>
    </div>
    <div class="design-viewer-stage" id="designViewerStage">
        <img id="designViewerImage" alt="" draggable="false" hidden>
        <p id="designViewerLoading" role="status">{% translate "Loading image…" %}</p>
        <p id="designViewerError" role="alert" hidden>{% translate "Image unavailable. Please try again." %} <button type="button" data-viewer-action="retry">{% translate "Retry" %}</button></p>
    </div>
    <div class="design-viewer-controls">
        <button type="button" data-viewer-action="previous" aria-label="{% translate 'Previous image' %}">‹</button>
        <span id="designViewerCounter" aria-live="polite"></span>
        <button type="button" data-viewer-action="next" aria-label="{% translate 'Next image' %}">›</button>
        <button type="button" data-viewer-action="out" aria-label="{% translate 'Zoom out' %}">−</button>
        <button type="button" data-viewer-action="reset" aria-label="{% translate 'Reset zoom' %}" id="designViewerZoom">100%</button>
        <button type="button" data-viewer-action="in" aria-label="{% translate 'Zoom in' %}">+</button>
    </div>
</dialog>
