<!DOCTYPE html>
<html>
<head>
    <title>Delete Complaint</title>
    {% load static %}
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            background-image:
                radial-gradient(circle, rgba(220, 38, 38, 0.2) 0 1px, transparent 1.7px),
                linear-gradient(115deg, transparent 0%, rgba(220, 38, 38, 0.055) 42%, rgba(255, 255, 255, 0.035) 50%, transparent 58%),
                linear-gradient(rgba(18, 18, 20, 0.82), rgba(18, 18, 20, 0.9)),
                url("{% static 'seat-background.webp' %}");
            background-position: 0 0, center, center, center;
            background-size: 28px 28px, 100% 100%, 100% 100%, cover;
            background-attachment: fixed, fixed, fixed, fixed;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        @media (max-width: 768px), (pointer: coarse) {
            body {
                background-position: 0 0, center, center, 18% center;
                background-attachment: scroll, scroll, scroll, scroll;
            }
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background-color: rgba(42, 42, 61, 0.88);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #d1d1e0;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #3a3a4f;
            color: #ffffff;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button[type="submit"] {
            margin-top: 25px;
            width: 100%;
            background-color:rgb(199, 33, 88);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color:rgb(212, 223, 233);
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #ef4444;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>Are you sure you want to delete this complaint?</h2>
    <p>Complaint Batch Order: <strong>{{ complaint.batch_order }}</strong></p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'complaint_list' %}">Cancel</a>
    </form>
</body>
</html>
